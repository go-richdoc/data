name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GOWORK: "off"

# Least privilege, named rather than inherited. Reported by `wfaudit`: with no
# permissions declared, every job received the repository's DEFAULT token —
# read-only or read-write by an organisation setting this file cannot show,
# which put "what can a job here reach" somewhere no reviewer of this file
# could read. Nothing below writes.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # The race detector needs cgo at test time; the library itself stays
    # CGO-free, which the cross-build job proves with CGO_ENABLED=0.
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      # go.mod and not a hard-coded version, which `gofloor` reports as a
      # finding: a lane pinned beside a go.mod drifts from it silently, and
      # the toolchain decides every standard-library finding.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt needs to be run on:"
            echo "$out"
            exit 1
          fi
      - name: Vet
        run: CGO_ENABLED=0 go vet ./...
      - name: Test (race)
        run: go test -race ./...

      # ⛔ -coverpkg=./... and not plain -cover. `go test ./...` attributes a
      # package's coverage only to ITS OWN tests, so the cross-package tests
      # here — the ones that drive four readers through the same question —
      # counted for nothing, and the repository read as 95% when it was
      # already at 100%. A coverage figure that silently excludes half its
      # own tests is the kind of number nobody checks.
      - name: Test with coverage, across packages
        run: go test -covermode=set -coverpkg=./... -coverprofile=cover.out ./...

      # Unlike this organisation's rst reader, which walks a doctree from an
      # independently evolving engine, everything here is parsed by the
      # standard library and every branch is reachable. So the gate is exact:
      # anything less means a path nobody has checked.
      - name: Enforce exact 100% statement coverage
        run: |
          go tool cover -func=cover.out
          below=$(go tool cover -func=cover.out | awk '$3 != "100.0%"')
          if [ -n "$below" ]; then
            echo "::error::coverage below 100%"
            echo "$below"
            exit 1
          fi

  vulns:
    # The organisation's lane, defined once in go-richdoc/.github and called
    # here. It runs govulncheck and hands the stream to vulngate rather than
    # believing an exit status that answers a different question, and it scans
    # under this repository's own go.mod. See that file for the measurements
    # that put it there.
    uses: go-richdoc/.github/.github/workflows/vulns.yml@main

  cross-build:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    strategy:
      fail-fast: false
      # goos and goarch separately, so no shell parses a target at all.
      #
      # ⛔ AND THIS FILE WAS ALREADY RIGHT, which is worth recording because
      # every other workflow in this organisation was not. The step here
      # assigned first and exported afterwards —
      #
      #     GOOS=$(echo "${{ matrix.target }}" | cut -d/ -f1)
      #     export GOOS GOARCH
      #
      # — which is exactly what shellcheck's SC2155 asks for, so a failed
      # split would NOT have been masked here. `actionlint` confirms it: five
      # of the six remaining repositories report SC2155 twice and this one
      # reports nothing. So this change is consistency and the removal of a
      # `cut` dependency, NOT a fix, and it should not be described as one.
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: riscv64 }
          - { goos: linux, goarch: ppc64le }
          - { goos: linux, goarch: s390x }
          - { goos: linux, goarch: loong64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: js, goarch: wasm }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...
